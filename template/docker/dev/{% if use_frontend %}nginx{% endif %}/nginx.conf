events {
    worker_connections 1024;
}

http {
    # websocket (przeładowanie Nuxta na żywo) przez proxy
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream django_backend {
        server web:8000;
    }

    upstream vue_frontend {
        server vue:3000;
    }

    server {
        listen 80;

        # API do Django (bez prefiksu /backend)
        location /backend/ {
            proxy_pass http://django_backend/;
            proxy_set_header Host $http_host;  # z portem, inaczej Django odrzuci Origin (CSRF)
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # reszta do Nuxta (SSR)
        location / {
            proxy_pass http://vue_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
