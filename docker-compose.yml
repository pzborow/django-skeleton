version: '3'
services:
  db:
    image: postgres:9.5
    volumes:
      - data-postgresql:/var/lib/postgresql
    environment:
      - POSTGRES_DB=app
      - POSTGRES_USER=app
      - POSTGRES_PASSWORD=test
    logging:
      driver: "json-file"
      options:
        max-size: "1k"
        max-file: "1"
  web:
    build: images/django_app
    volumes:
      - ./services/django_app:/srv
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - SHELL=/bin/bash
      - PG_HOST=db
      - PG_DATABASE=app
      - PG_USER=app
      - PG_PASS=test
      - DEFAULT_RUN_COMMAND=runserver

volumes:
   data-postgresql:
     external: true
