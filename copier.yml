_min_copier_version: "9"
_subdirectory: template

# lock zależności robi uv na hoście, bo obraz bez locka się nie zbuduje (copier copy/update potrzebuje --trust);
# później lock odświeża make lock uvem z obrazu
_tasks:
  - "cd backend && uv lock"

project_name:
  type: str
  help: Nazwa projektu (do README)
  default: Projekt

project_slug:
  type: str
  help: Nazwa techniczna (compose, baza, paczka), małe litery, cyfry i _
  default: >-
    {{ project_name | lower | replace('ą', 'a') | replace('ć', 'c') | replace('ę', 'e') | replace('ł', 'l')
    | replace('ń', 'n') | replace('ó', 'o') | replace('ś', 's') | replace('ź', 'z') | replace('ż', 'z')
    | replace(' ', '_') | replace('-', '_') }}
  validator: >-
    {% if not (project_slug | regex_search('^[a-z][a-z0-9_]*$')) %}tylko małe litery, cyfry i _, na początku
    litera{% endif %}

python_version:
  type: str
  help: Wersja Pythona w obrazie
  default: "3.13"

use_frontend:
  type: bool
  help: Frontend w Nuxt (Vue z SSR) i nginx przed całością
  default: true

use_celery:
  type: bool
  help: Celery z Redisem (worker i beat)
  default: false

use_elasticsearch:
  type: bool
  help: Elasticsearch (jeden węzeł, bez zabezpieczeń, tylko dev)
  default: false
